[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-foundation"
version = "0.1.0"
description = "Retrieval-only proof of concept: find evidence passages in large codebases and design documents from natural-language questions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    # 構文の単位で分けるための解析器(C・C++・C#)
    "tree-sitter>=0.25",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",
    # 手元で計算する埋め込み(ONNX)と、ベクトルの総当たり
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "huggingface_hub>=0.30",
    # cases.jsonl / results.jsonl の検査
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctxf = "context_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
context_foundation = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "model: 埋め込みモデルの実物が要るテスト(モデルが手元に無ければ飛ばす)",
]
